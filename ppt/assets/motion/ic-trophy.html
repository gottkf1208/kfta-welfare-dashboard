<script>
(function () {
  // ① 설정: 여기만 고치면 됩니다
  const CONFIG = {
    speed: 1,          // 속도 (1 = 기본, 2 = 두 배)
    bg: 'transparent',     // 배경색 ('transparent'로 바꾸면 투명)
    colors: ['#ffffff', '#eef1f6', '#d5dbe6', '#9aa6bd', '#5b6b8c', '#1b3a8f', '#1f3460', '#15171c'],   // 색 8개: 밝은 색 → 진한 색 ([5] 포인트 색, [7] 글자색)
    ratio: '1 / 1'     // 화면 비율 (가로 / 세로)
  };

  // ② 모션: 트로피
  function ic4Kit(api) {
    const clamp = x => Math.max(0, Math.min(1, x));
    const NS = 'http://www.w3.org/2000/svg';
    const rgb = c => /^#[0-9a-f]{6}$/i.test(c || '') ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : null;

    const C = api.colors, u = api.u, W = api.W, H = api.H;
    const P = api.clear ? C[0] : (rgb(api.bg) ? api.bg : C[0]);   // 아이콘 속 면: 바탕색 (투명 배경이면 흰 판)
    const L = api.clear ? api.ink : api.fg;                       // 선 색: 바탕 위 글자색 (투명 배경이면 진한 글자색)
    const pick = list => list.find(c => far(c, P) > 70) || list[0];
    const A = pick([api.accent, api.deep, C[4]]);                 // 포인트 면 (바탕과 너무 비슷하면 둘째 포인트 색으로)
    const B = pick([api.deep, api.accent, C[4]]);                 // 둘째 포인트 면
    const n3 = v => Math.round(v * 1000) / 1000;
    const FONT = '"Paperlogy","Pretendard",sans-serif';
    const k = {
      P: P, L: L, A: A, B: B, OA: api.on(A), OB: api.on(B), IN: 1.3, clamp: clamp, n3: n3, FONT: FONT,   // IN: 첫 등장 시간(초)
      seg: (t, a, b) => clamp((t - a) / (b - a)),                 // t가 a~b 사이 어디쯤인지 0~1로
      mix: (a, b, p) => a + (b - a) * p,
      out: x => 1 - Math.pow(1 - clamp(x), 3),                    // 빠르게 출발해 부드럽게 멈춤
      inn: x => Math.pow(clamp(x), 2),                            // 떨어지듯 빨라짐
      io: x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(2 - 2 * x, 3) / 2; },   // 천천히-빠르게-천천히
      back: (x, s) => { const q = s == null ? 1.6 : s; x = clamp(x) - 1; return 1 + (q + 1) * x * x * x + q * x * x; },   // 살짝 넘쳤다 제자리
      hump: (q, a, b, c, d) => k.io(k.seg(q, a, b)) * (1 - k.io(k.seg(q, c, d))),   // a~b에 0 → 1, c~d에 1 → 0
      pop: (q, a, b) => { const x = k.seg(q, a, b); return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; },   // a~b 동안 0 → 1 → 0
      // 바닥에 닿아 두어 번 통통 튀며 멈춤
      bounce: x => { x = clamp(x); const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
      // n번 흔들리며 잦아듦 (x: 0~1)

      alpha: (c, a) => 'rgba(' + (rgb(c) || [0, 0, 0]).join(',') + ',' + a + ')',
      id: () => { ic4Kit.n = (ic4Kit.n || 0) + 1; return 'ic4u' + ic4Kit.n; },   // 한 페이지에 여러 개가 있어도 겹치지 않는 이름

          const row = document.createElement('div');
          row.style.cssText = `position:absolute;left:0;width:${n3(W)}px;top:${n3(top + h + gap)}px;text-align:center;`;
          tag = document.createElement('span');
          tag.textContent = String(label).trim();

      },
      tag(st, p) { if (st.tag) { st.tag.style.opacity = n3(p); st.tag.style.transform = `translateY(${n3((1 - p) * u * 0.02)}px)`; } },
      el(parent, tag, attr) { const e = document.createElementNS(NS, tag); for (const a in attr) e.setAttribute(a, attr[a]); parent.appendChild(e); return e; },
      g(parent, tr) { return k.el(parent, 'g', tr ? { transform: tr } : {}); },
      // 둥근 끝 선 하나 (그려지기 진행은 draw로)
      line(parent, d, w, color) { return k.el(parent, 'path', { d: d || 'M0 0', fill: 'none', stroke: color || L, 'stroke-width': w || 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1 }); },
      // 선이 p만큼 그려지고 앞에서부터 q만큼 지워진 모습 (0~1)
      draw(el, p, q) {
        q = q || 0;
        if (p <= 0.001 || q >= 0.999 || p - q <= 0.0005) { el.style.visibility = 'hidden'; return; }
        el.style.visibility = '';
        if (p >= 0.999 && q <= 0.001) { el.removeAttribute('stroke-dasharray'); el.removeAttribute('stroke-dashoffset'); return; }

      },
      // 여러 조각: 선은 그려지고 면은 차오름
      reveal(els, I) { els.forEach(el => { k.draw(el, I.draw); if (el.getAttribute('fill') !== 'none') el.setAttribute('fill-opacity', n3(I.fill)); }); },
      // 그림자 겹이 오른쪽 아래로 비껴 나옴
      shade(el, I, d) { const s = (d == null ? 4.5 : d) * I.shade; el.setAttribute('transform', `translate(${n3(s)} ${n3(s)})`); el.style.visibility = I.shade > 0.001 ? '' : 'hidden'; },
      // 변형 글: (px,py)를 축으로 회전 r(도)·크기 sx,sy 뒤 (x,y)만큼 옮김
      T: (x, y, r, sx, sy, px, py) => `translate(${n3(x + px)} ${n3(y + py)}) rotate(${n3(r)}) scale(${n3(sx)} ${n3(sy == null ? sx : sy)}) translate(${-px} ${-py})`,
      // 같은 모양을 두 겹으로: 뒤(그림자, 기본 포인트 색) + 앞(바탕 면 + 선). build(층, 면색, 선색, 앞인가) → 그 층 조각 목록
      twin(parent, build, under, sc) {
        const back = k.g(under || parent), sh = k.g(back), fr = k.g(parent);
        build(sh, sc || A, sc || A, false);
        const els = build(fr, P, L, true);
        return { back: back, sh: sh, fr: fr, els: els, set(tr) { sh.setAttribute('transform', tr); fr.setAttribute('transform', tr); }, intro(I, d) { k.reveal(els, I); k.shade(back, I, d); } };
      },
      // 속이 빈 굵은 선(테두리 4 + 바탕 면) 여러 가닥 + 포인트 색 그림자. 바깥 선을 모두 그린 뒤 안쪽 면을 그려 이음매가 없음
      tube(parent, ds, w) {

        const all = j => [parts[j].s, parts[j].o, parts[j].i];
        return {
          back: back, sh: sh, fr: fr, lo: lo, li: li, parts: parts,
          set(tr) { sh.setAttribute('transform', tr); fr.setAttribute('transform', tr); },
          draw(j, p, q) { all(j).forEach(e => k.draw(e, p, q)); },
          d(j, d) { all(j).forEach(e => e.setAttribute('d', d)); },

      clip(st, shapes) {

      },
      // 빛 한 줄이 모양 위를 비스듬히 훑고 지나감. o.x0~o.x1: 높이 o.cy에서 띠 가운데가 지나는 자리. set(p): 0 → 1 (양 끝에선 안 보임)
      glint(st, parent, shapes, o) {

        const wd = o.w || 18, band = k.el(g, 'rect', { x: -wd / 2, y: -150, width: wd, height: 400, fill: `url(#${gid})` });
        const x0 = o.x0 == null ? -20 : o.x0, x1 = o.x1 == null ? 120 : o.x1;

      },
      // 글자 한 줄 (가운데 맞춤, max보다 길면 글자 크기를 줄여 맞춤)
      text(parent, str, x, y, size, o) {

        const e = k.el(parent, 'text', { x: x, y: y, 'font-size': size, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': o.base || 'central', fill: o.c || L });
        e.style.cssText = `font-family:${FONT};font-weight:${o.w || 800};letter-spacing:${o.ls || '-0.02em'};font-variant-numeric:tabular-nums;`;
        e.textContent = str == null ? '' : String(str);
        if (o.max) k.fit(e, o.max, size);
        return e;
      },
      // 투명 배경일 때 글자 둘레에 흰 테를 둘러 영상 위에서도 읽히게

      fit(e, max, size) { let w = 0; try { w = e.getComputedTextLength(); } catch (err) {} if (w > max) e.setAttribute('font-size', n3(size * max / w)); return e; },

      },
      // 모서리를 둥글린 다각형
      roundPoly(pts, r) {

    sync();
  
    return {
      play() { want = true; sync(); },
      pause() { want = false; sync(); },
      restart() { time = 0; if (frame) frame(time); },
      seek(t) { time = t; if (frame) frame(time); if (watch) mend(watch.takeRecords()); },   // t초의 장면으로 건너뜀 (영상으로 한 장씩 찍을 때)
      now() { return time; },                       // 지금 몇 초의 장면인지 (발표기에서 씀)
      motion() { return frame; },                   // 모션이 돌려준 장면 함수 (frame.steps 같은 정보를 읽을 때)
      slots() { return used.size || usedArt.size; },   // 이 장면이 쓰는 그림 칸 수 (사이트의 '내 사진' 칸)
      destroy() { want = false; sync(); if (LIVE) Object.keys(hands).forEach(k => root.removeEventListener(k, hands[k])); ro.disconnect(); io.disconnect(); if (watch) watch.disconnect(); clearTimeout(timer); if (document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener('loadingdone', refit); if (frame && frame.dispose) frame.dispose(); root.textContent = ''; }
    };
  }

  qmEngine(document.getElementById('qm-imk-trophy'), CONFIG, ic4Trophy);
})();
</script>
