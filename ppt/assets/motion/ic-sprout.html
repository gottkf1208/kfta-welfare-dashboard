<body>
<!-- 쿼카 모션랩 · 새싹 자람 (Sprout) -->
<!-- 글꼴: 페이퍼로지 (OFL) · 프리텐다드 (OFL) · 눈누(noonnu.cc)의 무료 한글 글꼴 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+KR:wght@100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'Paperlogy';font-style:normal;font-weight:100;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:200;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:300;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:800;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2) format('woff2')}@font-face{font-family:'Paperlogy';font-style:normal;font-weight:900;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2) format('woff2')}
</style>
<div id="qm-ina-sprout" style="width:100%;max-width:calc(100vh * 1)"></div>
<script>
(function () {
  // ① 설정: 여기만 고치면 됩니다
  const CONFIG = {
    speed: 1,          // 속도 (1 = 기본, 2 = 두 배)
    bg: 'transparent',     // 배경색 ('transparent'로 바꾸면 투명)
    colors: ['#ffffff', '#eef3ef', '#d3e1d6', '#9cb6a3', '#5d8068', '#1b3a8f', '#1f3460', '#141a16'],   // 색 8개: 밝은 색 → 진한 색 ([5] 포인트 색, [7] 글자색)
    ratio: '1 / 1'     // 화면 비율 (가로 / 세로)
  };

  // ② 모션: 새싹 자람
  function ic3Kit(api) {
    const W = api.W, H = api.H, u = api.u;
    const clamp = x => Math.max(0, Math.min(1, x));
    const hex = c => /^#[0-9a-f]{6}$/i.test(c || '');
    const rgb = c => hex(c) ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : [128, 128, 128];
    const light = c => { const v = rgb(c); return (v[0] * 299 + v[1] * 587 + v[2] * 114) / 1000; };
    const ground = api.clear ? 255 - light(api.fg) : light(api.bg);   // 바탕의 밝기 (투명 배경이면 글자색의 반대쪽으로 봄)
    const seen = c => Math.abs(light(c) - ground) > 64;               // 바탕 위에서 또렷이 보이는 색인지
    const tint = (c, a) => 'rgba(' + rgb(c).join(',') + ',' + a + ')';
    const blend = (a, b, p) => 'rgb(' + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * p)).join(',') + ')';
    const paper = hex(api.bg) ? api.bg : api.colors[0];
    const f = v => Math.round(v * 100) / 100;
    const NS = 'http://www.w3.org/2000/svg';
    const tag = 'ic3k' + (ic3Kit.n = (ic3Kit.n || 0) + 1) + '_';   // 한 페이지에 여러 개를 띄워도 가림판 이름이 겹치지 않게
    let ids = 0;
    const k = {
      W: W, H: H, u: u, f: f, tint: tint, blend: blend, paper: paper, clamp: clamp,
      line: api.fg,                                                   // 선 색 (바탕 위 글자색)
      pop: api.clear ? api.accent : [api.accent, api.deep, api.tone(4), api.fg].find(seen) || api.fg,   // 포인트 색 (바탕에 묻히면 다음 색)
      pop2: api.clear ? api.deep : [api.deep, api.accent, api.tone(3), api.fg].find(seen) || api.fg,    // 둘째 포인트 색
      lite: api.colors[0],                                            // 밝은 점·반짝임
      sw: 3.2,                                                        // 선 굵기 (0~100 칸 기준)
      dark: ground < 128,
      TAU: Math.PI * 2,
      seg: (t, a, b) => clamp((t - a) / (b - a)),                     // t가 a~b 사이 어디쯤인지 0~1로
      mix: (a, b, p) => a + (b - a) * p,
      fr: x => x - Math.floor(x),
      out: x => 1 - Math.pow(1 - clamp(x), 4),                        // 빠르게 출발해 부드럽게 멈춤
      into: x => Math.pow(clamp(x), 3),
      io: x => { x = clamp(x); return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; },   // 천천히-빠르게-천천히
      back: x => { x = clamp(x) - 1; return 1 + 2.2 * x * x * x + 1.2 * x * x; },   // 살짝 넘쳤다가 제자리
      bell: x => Math.sin(Math.PI * clamp(x)),                        // 0 → 1 → 0
      phase: (t, t0, len) => { const p = ((t - t0) / len) % 1; return p < 0 ? p + 1 : p; },   // 살아 있는 움직임의 진행 0~1
      // 면 색: 바탕이 칠해져 있으면 바탕과 섞은 불투명한 색(뒤를 가림), 투명 배경이면 반투명
      soft: (c, a) => api.clear ? tint(c, Math.min(1, a * 1.3)) : blend(paper, c, a),
      face: fam => '"' + fam + '","Paperlogy","Pretendard",sans-serif',
      uid: () => tag + (++ids),
      el(parent, css, text, name) {
        const e = document.createElement(name || 'div');
        e.style.cssText = css || '';
        if (text !== undefined) e.textContent = text;
        parent.appendChild(e);
        return e;
      },
      node(parent, name, attrs, css) {
        const e = document.createElementNS(NS, name);
        for (const a in attrs || {}) e.setAttribute(a, attrs[a]);
        if (css) e.style.cssText = css;
        parent.appendChild(e);
        return e;
      },
      // 선 하나 (pen으로 앞에서부터 그리고 지움). 길이를 1로 맞춰 둠
      path: (parent, d, color, width) => k.node(parent, 'path', { d: d || '', pathLength: 1, fill: 'none', stroke: color, 'stroke-width': width == null ? k.sw : width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }),
      // 면 하나 (선 없이 칠만)
      shape: (parent, d, fill) => k.node(parent, 'path', { d: d || '', fill: fill, stroke: 'none' }),
      // 선을 off~on 구간(0~1)만 보이게
      pen(el, on, off) {
        off = off || 0;
        const len = Math.max(0, Math.min(1, on) - off);
        el.style.strokeDasharray = len.toFixed(4) + ' 2';
        el.style.strokeDashoffset = (-off).toFixed(4);
        el.style.strokeOpacity = len > 0.002 ? '' : 0;
      },
      ln: (x1, y1, x2, y2) => 'M' + f(x1) + ',' + f(y1) + 'L' + f(x2) + ',' + f(y2),
      circ: (cx, cy, r) => 'M' + f(cx - r) + ',' + f(cy) + 'a' + f(r) + ',' + f(r) + ' 0 1,0 ' + f(2 * r) + ',0a' + f(r) + ',' + f(r) + ' 0 1,0 ' + f(-2 * r) + ',0',
      oval: (cx, cy, rx, ry) => 'M' + f(cx - rx) + ',' + f(cy) + 'a' + f(rx) + ',' + f(ry) + ' 0 1,0 ' + f(2 * rx) + ',0a' + f(rx) + ',' + f(ry) + ' 0 1,0 ' + f(-2 * rx) + ',0',
      // 구름 한 덩이 (가운데 cx,cy, 크기 s=1이면 너비 60). 아래가 평평하고 위에 봉우리 셋
      cloud(cx, cy, s) {
        const p = (x, y) => f(cx + x * s) + ',' + f(cy + y * s), r = v => f(v * s) + ',' + f(v * s);
        return 'M' + p(-20, 12) + 'A' + r(10) + ' 0 0 1 ' + p(-30, 2) + 'A' + r(10) + ' 0 0 1 ' + p(-19.9, -8) + 'A' + r(16) + ' 0 0 1 ' + p(11.5, -10.1) +
          'A' + r(12) + ' 0 0 1 ' + p(30, 0) + 'A' + r(12) + ' 0 0 1 ' + p(18, 12) + 'Z';
      },
      // 점들을 부드러운 곡선으로 (closed면 닫힌 곡선)
      curve(pts, closed) {
        const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
        let d = 'M' + f(pts[0][0]) + ',' + f(pts[0][1]);
        for (let i = 0; i < (closed ? n : n - 1); i++) {
          const a = P(i - 1), b = P(i), c = P(i + 1), e = P(i + 2);
          d += 'C' + f(b[0] + (c[0] - a[0]) / 6) + ',' + f(b[1] + (c[1] - a[1]) / 6) + ' ' + f(c[0] - (e[0] - b[0]) / 6) + ',' + f(c[1] - (e[1] - b[1]) / 6) + ' ' + f(c[0]) + ',' + f(c[1]);
        }
        return d + (closed ? 'Z' : '');
      },
      // 네 갈래 반짝임 (가운데 0,0, 반지름 s)
      spark: s => { const c = s * 0.16; return 'M0,' + f(-s) + 'Q' + f(c) + ',' + f(-c) + ' ' + f(s) + ',0Q' + f(c) + ',' + f(c) + ' 0,' + f(s) + 'Q' + f(-c) + ',' + f(c) + ' ' + f(-s) + ',0Q' + f(-c) + ',' + f(-c) + ' 0,' + f(-s) + 'Z'; },
      move: (el, x, y, r, sx, sy) => el.setAttribute('transform', 'translate(' + f(x) + ' ' + f(y) + ')' + (r ? ' rotate(' + f(r) + ')' : '') + (sx != null ? ' scale(' + (+sx).toFixed(3) + ' ' + (+(sy == null ? sx : sy)).toFixed(3) + ')' : '')),
      // d 모양 안쪽만 보이는 판
      clip(svg, d) {
        const id = k.uid(), cp = k.node(svg, 'clipPath', { id: id, clipPathUnits: 'userSpaceOnUse' });
        return { url: 'url(#' + id + ')', path: k.node(cp, 'path', { d: d }) };
      },
      // add(d)로 넣은 모양 자리만 가리는 판 (투명 배경에서도 앞의 것이 뒤의 것을 가리게)
      mask(svg) {
        const id = k.uid(), m = k.node(svg, 'mask', { id: id, maskUnits: 'userSpaceOnUse', x: -300, y: -300, width: 700, height: 700 });
        k.node(m, 'rect', { x: -300, y: -300, width: 700, height: 700, fill: '#fff' });
        return { url: 'url(#' + id + ')', add: (d, w) => k.node(m, 'path', { d: d || '', fill: '#000', stroke: '#000', 'stroke-width': w || 0, 'stroke-linejoin': 'round' }) };
      },
      // 무대: 가운데 아이콘 판(0~100 칸) + 아래 이름표. 투명 배경이면 전체에 얇은 그림자
      stage(label, show) {
        const on = !!(show && String(label || '').trim());
        const sh = k.dark ? 'rgba(0,0,0,' : 'rgba(255,255,255,';
        const layer = k.el(api.root, 'position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;' +
          (api.clear ? `filter:drop-shadow(0 0 ${f(0.6 + u * 0.0025)}px ${sh}.6)) drop-shadow(0 ${f(u * 0.006)}px ${f(u * 0.02)}px ${sh}.34));` : ''));
        const S = Math.min(W * 0.8, H * (on ? 0.6 : 0.74)), gap = S * 0.085;
        let box = null, lab = null, h = 0;
        if (on) {
          box = k.el(layer, 'position:absolute;left:0;width:100%;text-align:center;overflow:hidden;padding:.12em 0;');
          lab = k.el(box, `display:inline-block;font:600 ${f(Math.max(9, S * 0.14))}px/1.2 ${k.face('Paperlogy')};letter-spacing:-.01em;color:${api.fg};white-space:nowrap;will-change:transform;`, label, 'span');
          const room = W * 0.88, w = lab.offsetWidth;
          if (w > room) lab.style.fontSize = f(Math.max(9, S * 0.14) * room / w) + 'px';
          h = box.offsetHeight;
        }
        const y0 = (H - S - (on ? gap + h : 0)) / 2, x0 = (W - S) / 2;
        if (box) box.style.top = f(y0 + S + gap) + 'px';
        const svg = k.node(layer, 'svg', { viewBox: '0 0 100 100' }, `position:absolute;left:${f(x0)}px;top:${f(y0)}px;width:${f(S)}px;height:${f(S)}px;overflow:visible;`);
        return {
          layer: layer, svg: svg, S: S, x0: x0, y0: y0,
          labIn: p => { if (lab) { lab.style.transform = `translate3d(0,${f((1 - p) * 105)}%,0)`; lab.style.opacity = p.toFixed(3); } }
        };
      }
    };
    return k;
  }
  function ic3Sprout(api) {
    const LABEL = '새싹';           // 아이콘 아래 이름표
    const SHOW_LABEL = false;        // 이름표 보이기
    const LOOP = 4;                 // 살랑이는 한 바퀴(초)
    const k = ic3Kit(api), st = k.stage(LABEL, SHOW_LABEL), svg = st.svg, t0 = 2.0;
    const groundL = k.path(svg, 'M14,82H86', k.line);
    const plant = k.node(svg, 'g');
    const stem = k.path(plant, 'M50,81C50,71 47.5,61 50,51', k.line);
    const leafD = 'M0,0C6,-11 18.5,-13 27,-3.5C19.5,5.5 7,6.5 0,0Z';
    const leaves = [1, -1].map(sd => { const g = k.node(plant, 'g'); return { sd: sd, g: g, face: k.shape(g, leafD, k.soft(k.pop, 0.3)), edge: k.path(g, leafD, k.line), rib: k.path(g, 'M3.5,-1Q13.5,-5 23.5,-3.8', k.line, k.sw * 0.6) }; });
    const marks = [-90, -138, -42].map(a => ({ a: a * Math.PI / 180, el: k.path(plant, '', k.pop) }));
    const moundF = k.shape(svg, 'M30,82Q50,69 70,82Z', k.soft(k.line, 0.1)), moundE = k.path(svg, 'M30,82Q50,69 70,82', k.line);
    const frame = t => {
      t = Math.max(0, t);
      const ph = k.phase(t, t0, LOOP), amp = k.seg(t, t0 - 0.3, t0 + 0.8);
      plant.setAttribute('transform', `rotate(${k.f(amp * (3 * Math.sin(k.TAU * ph) + Math.sin(k.TAU * 2 * ph + 0.6) - Math.sin(0.6)))} 50 82)`);
      k.pen(groundL, k.io(k.seg(t, 0.05, 0.7)));
      k.pen(moundE, k.io(k.seg(t, 0.2, 0.8)));
      moundF.style.opacity = k.seg(t, 0.5, 0.9).toFixed(3);
      k.pen(stem, k.out(k.seg(t, 0.6, 1.3)));
      leaves.forEach((o, i) => {
        const p = k.seg(t, 1.1 + i * 0.12, 1.85 + i * 0.12), a = -82 + 60 * k.back(p) + amp * 4 * Math.sin(k.TAU * ph * 2 + i * 1.7), s = 0.12 + 0.88 * k.out(p);
        o.g.setAttribute('transform', `translate(50 51) scale(${o.sd} 1) rotate(${k.f(a)}) scale(${s.toFixed(3)})`);
        o.g.style.opacity = p > 0 ? 1 : 0;
        k.pen(o.edge, 1); k.pen(o.rib, k.seg(p, 0.35, 1));
        o.face.style.opacity = k.seg(p, 0.2, 0.7).toFixed(3);
      });
      const mq = k.seg(ph, 0.05, 0.5), mp = k.out(mq);
      marks.forEach(o => {
        const r1 = 7 + 3 * mp, r2 = 10 + 4.5 * mp, cx = Math.cos(o.a), cy = Math.sin(o.a);
        o.el.setAttribute('d', k.ln(50 + cx * r1, 42 + cy * r1, 50 + cx * r2, 42 + cy * r2));
        k.pen(o.el, 1); o.el.style.opacity = (amp * k.bell(mq)).toFixed(3);
      });
      st.labIn(k.out(k.seg(t, 1.4, 2.2)));
    };
    frame.fonts = true;
    frame.loop = t0 + LOOP * 2;
    return frame;
  }

  // ③ 공통 엔진: 고칠 필요 없습니다
  function qmEngine(root, CFG, motion) {
    // 색 8개: 가장 밝은 색 → 가장 진한 색. [0] 흰 판·밝은 글자, [1]~[4] 연한 색에서 중간 색, [5] 포인트 색, [6] 둘째 포인트 색, [7] 글자색
    // 바꾸려면 CONFIG에 colors: ['#...', ...] 를 같은 순서로 넣으면 됩니다. 비워 두면 흰색·네이비 계열이 쓰입니다
    const COLORS = CFG.colors || ['#ffffff', '#e8ecf3', '#cfd7e6', '#9aa8c4', '#5c7099', '#1f3460', '#6e1a2f', '#15171c'];
    // 매번 같은 순서가 나오는 난수 (같은 seed면 같은 결과)
    const rand = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    // 샘플 그림: CONFIG.images가 비어 있을 때 쓰입니다. 어느 카드에 어떤 그림이 갈지는 열 때마다 섞입니다
    const dice = rand(CFG.seed || Math.floor(Math.random() * 1e9) + 1);
    const shift = Math.floor(dice() * 16);
    // 내 이미지: 칸마다 하나씩(빈 칸은 null → 그 칸은 샘플 그림). 칸보다 장면의 그림 자리가 많으면 돌아가며 씀
    const IMGS = (CFG.images || []).slice();
    const NIMG = IMGS.some(Boolean) ? IMGS.length : 0;
    const used = new Set(), usedArt = new Set();     // 장면이 몇 번째 그림까지 쓰는지 (사이트가 사진 칸 수를 정할 때 읽음)
    const FONT = '"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    // 색의 밝기 (0 = 검정, 255 = 흰색). #rrggbb 꼴이 아니면 검정으로 봅니다
    // 투명 배경 위에 다른 배경을 깔 때(CONFIG.under = 그 배경의 대표 색)는 그 색을 바탕으로 보고 글자색을 고릅니다
    const light = color => color === 'transparent' && /^#[0-9a-f]{6}$/i.test(CFG.under || '') ? light(CFG.under) : /^#[0-9a-f]{6}$/i.test(color) ? (parseInt(color.slice(1, 3), 16) * 299 + parseInt(color.slice(3, 5), 16) * 587 + parseInt(color.slice(5, 7), 16) * 114) / 1000 : 0;
    const bright = light(CFG.bg);
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let frame = null, time = CFG.startAt || (still ? 4 : 0), last = 0, raf = 0, timer = 0, size = '';
    let playing = false, seen = true, want = CFG.autoplay !== false && !still, drew = false;
    // 랜딩페이지용: 실제 마우스·스크롤에 반응합니다 (CONFIG.live). true = 페이지에 붙여 쓸 때, 'try' = 미리보기 창(마우스가 없으면 연출대로)
    const LIVE = CFG.live === true || CFG.live === 'try', TRY = CFG.live === 'try';
    const live = { x: 0, y: 0, tx: 0, ty: 0, over: 0, on: false, down: 0, press: false, s: 0, ts: 0, ready: false };
  
    const api = {
      root: root,
      bg: CFG.bg,
      clear: CFG.bg === 'transparent',              // 투명 배경으로 그리는 중 (영상 편집기에 얹을 자막 등). 이때는 화면 전체를 칠하는 바탕을 그리지 않습니다
      fg: bright > 150 ? COLORS[7] : COLORS[0],     // 배경 위에 바로 쓰는 글자색
      ink: COLORS[7],                               // 흰 판 위에 쓰는 글자색
      colors: COLORS.slice(),                       // 색 8개 그대로 (배경 모션이 그라데이션 재료로 씀)
      accent: COLORS[5],                            // 포인트 색
      deep: COLORS[6],                              // 둘째 포인트 색
      on: color => light(color) > 150 ? COLORS[7] : '#ffffff',   // 그 색 위에 올릴 글자색 (밝은 색 위엔 진한 글자, 진한 색 위엔 흰 글자)
      tone: i => COLORS[1 + (i % 5 + 5) % 5],       // i번째 변주 색 (연한 색 ~ 포인트 색)
      rand: rand,
      font: FONT,
      ko: text => /[\u3131-\u318e\uac00-\ud7a3]/.test(text),   // 한글이 들어 있나 (한글이 든 글줄은 한글 글꼴 하나로 씁니다)
      count: NIMG,                                  // 넣은 이미지 칸 수 (0이면 샘플)
      words: CFG.words || [],                       // 넣은 낱말 (글자 모션에서 사용, 비면 기본 낱말)
      live: LIVE && !TRY,                           // 실제 페이지에서 마우스·스크롤에 반응하는 중 (미리보기 칸·영상 저장 때는 false)
      // 발표(모션 PPT)에서 '다음 효과'를 누른 단계 { step, at }: 발표기가 채워 줌. 없으면 null (미리보기·영상은 시간표대로)
      cue: CFG.cue || null,
      page: CFG.page || 0,                          // 모션 PPT에서 몇 번째 장인지 (발표기가 채워 줌, 없으면 0)
      // 마우스 자리 { x, y: 무대 안의 px, down: 누름 0~1, on: 마우스가 와 있는 정도 0~1, fake: 연출용 가짜 커서를 보일 정도 0~1 }
      // demo: 미리보기·영상 저장 때 쓸 연출 자리 { x, y, down, on } (t로 계산해서 넘김). 실제 페이지에서는 진짜 마우스를 따라갑니다
      pointer(demo) {
        const d = Object.assign({ x: api.W / 2, y: api.H / 2, down: 0, on: 1 }, demo || {});
        if (!LIVE) return { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 };
        if (!live.ready) return TRY ? { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 } : { x: d.x, y: d.y, down: 0, on: 0, fake: 0 };
        const k = TRY ? live.over : 1, mix = (a, b) => a + (b - a) * k;
        return { x: mix(d.x, live.x), y: mix(d.y, live.y), down: mix(d.down, live.down), on: TRY ? mix(d.on, live.over) : live.over, fake: 1 - k };
      },
      // 스크롤 진행 0~1. 미리보기·영상 저장 때는 demo(t로 계산한 값), 실제 페이지에서는 이 상자(또는 CONFIG.track의 칸)가 화면을 지나는 정도
      scroll: demo => LIVE && !TRY ? live.s : demo,
      image: i => { used.add(i); if (!NIMG) return null; const u = IMGS[i % NIMG]; if (u) return u; const a = api.art(i, true); return a ? a.url : null; },   // i번째 이미지 주소 (없으면 null, 빈 칸이면 샘플 그림)
      // i번째 샘플 그림 { cv, url }. 코드에 qmArt가 함께 들어 있을 때만 나옵니다 (plain: 글자 없는 그림만)
      art: (i, plain) => { drew = true; usedArt.add(i); return typeof qmArt === 'function' ? qmArt(plain ? i : i + shift, plain) : null; },
      // i번째 그림을 CSS background 값으로: 내 이미지가 있으면 이미지, 없으면 샘플 그림
      paint: i => {
        used.add(i);
        const u = NIMG ? IMGS[i % NIMG] : null, a = u ? null : api.art(i, NIMG > 0);   // 내 사진 사이의 빈 칸은 글자 없는 샘플 사진으로
        return u ? `url("${u}") center / cover no-repeat, #1c1c1e` : a ? `url(${a.url}) center / cover no-repeat` : `linear-gradient(145deg, ${COLORS[2]}, ${COLORS[5]})`;
      },
      // 숏폼 자막용 미리보기 바탕: 영상 대신 깔아 두는 흐릿한 장면 (내 이미지를 넣으면 그 그림). 투명 배경일 때는 그리지 않고 null을 돌려줍니다
      footage(dim) {
        if (api.clear) return null;
        used.add(0);
        const el = document.createElement('div'), n = IMGS[0] ? 1 : 0;
        el.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;filter:brightness(' + (dim == null ? 0.85 : dim) + ');background:' + (n ? `url("${IMGS[0]}") center / cover no-repeat` :
          'radial-gradient(55% 32% at 28% 26%, rgba(243,237,226,.5), rgba(243,237,226,0) 70%), radial-gradient(45% 30% at 78% 52%, rgba(154,120,110,.45), rgba(154,120,110,0) 70%), ' +
          'radial-gradient(80% 45% at 50% 108%, rgba(31,52,96,.75), rgba(31,52,96,0) 72%), radial-gradient(40% 25% at 18% 70%, rgba(205,196,184,.28), rgba(205,196,184,0) 70%), linear-gradient(172deg, #4a4f5a, #23262d 60%, #15171c)') + ';';
        root.appendChild(el);
        return el;
      },
      // 0~1 사이 값을 부드럽게 (천천히 출발, 천천히 도착)
      ease: x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); },
      // 0~1 사이 값을 통통 튀게 (살짝 넘쳤다가 제자리로)
      spring: x => { x = Math.max(0, Math.min(1, x)) - 1; return 1 + 2.70158 * x * x * x + 1.70158 * x * x; },
      // 화면 한가운데가 (0,0,0)인 3D 공간. 숫자가 작을수록 원근감이 세집니다
      space(perspective) {
        root.style.perspective = perspective ? perspective + 'px' : 'none';
        return api.group(root, 'left:50%;top:50%;');
      },
      // 여러 조각을 한꺼번에 돌리거나 옮길 묶음
      group(parent, extra) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;' + (extra || '');
        parent.appendChild(el);
        return el;
      },
      // 빈 상자 하나. 상자의 중심이 (0,0)에 놓입니다 (UI 모션에서 사용)
      box(parent, w, h, css) {
        const el = document.createElement('div');
        el.style.cssText = `position:absolute;left:0;top:0;box-sizing:border-box;width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;font-family:${FONT};` + (css || '');
        parent.appendChild(el);
        return el;
      },
      // 카드 한 장. 카드의 중심이 (0,0)에 놓입니다 (카드 모션에서 사용)
      card(parent, i, w, h, twoSided) {
        const el = api.box(parent, w, h, 'overflow:hidden;'), s = el.style;
        s.borderRadius = Math.min(w, h) * (CFG.radius || 0) + 'px';
        s.backfaceVisibility = s.webkitBackfaceVisibility = twoSided ? 'visible' : 'hidden';
        s.background = api.paint(i);
        return el;
      }
    };
  
    function build() {
      const W = root.clientWidth, H = root.clientHeight;
      if (!W || !H || size === W + 'x' + H) return;
      size = W + 'x' + H;
      if (frame && frame.dispose) frame.dispose();   // WebGL 모션은 다시 만들기 전에 정리
      root.textContent = '';
      api.W = W; api.H = H; api.u = Math.min(W, H);
      if (LIVE && !TRY) { measure(); live.s = live.ts; }
      frame = motion(api);
      frame(time);
      runs(root);
      if (watch) watch.takeRecords();   // 방금 만든 장면은 위에서 다 봤으니 쌓인 기록은 버림
    }
    // 한 글줄 안에 한글과 영문·숫자가 섞였는데 영문 전용 글꼴(Anton·Inter 등)이 앞에 서 있으면,
    // 그 글줄은 글꼴 목록 뒤쪽의 한글 글꼴로 통째로 씁니다 (영문 글꼴과 한글 글꼴이 한 줄에서 따로 놀지 않게)
    const LATIN = /^(Anton|Archivo|Instrument Serif|Inter|JetBrains Mono)$/i;
    function runs(top) {
      const walk = document.createTreeWalker(top, NodeFilter.SHOW_TEXT), seen = new Set();
      for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.parentElement) seen.add(n.parentElement);
      seen.forEach(el => {
        let own = '';
        el.childNodes.forEach(c => { if (c.nodeType === 3) own += c.nodeValue; });
        if (!/[\u3131-\u318e\uac00-\ud7a3]/.test(own) || !/[A-Za-z0-9]/.test(own)) return;
        const list = getComputedStyle(el).fontFamily.split(',').map(f => f.trim().replace(/^["']|["']$/g, ''));
        if (!LATIN.test(list[0])) return;
        el.style.fontFamily = list.filter(f => !LATIN.test(f)).map(f => /^[a-z-]+$/.test(f) ? f : '"' + f + '"').join(',');
      });
    }
    // 장면이 글자를 바꾸면 바뀐 곳만 다시 봅니다
    const watch = window.MutationObserver ? new MutationObserver(list => mend(list)) : null;
    const mend = list => list.forEach(r => { const el = r.target.nodeType === 3 ? r.target.parentElement : r.target; if (el && root.contains(el)) runs(el); });
    if (watch) watch.observe(root, { childList: true, characterData: true, subtree: true });
    function tick(now) {
      raf = requestAnimationFrame(tick);
      const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
      time += dt * CFG.speed;                       // 흐른 시간만큼 (뒤로 가지 않게)
      if (CFG.once && time > CFG.once) time = CFG.once;   // 한 번만: 화면에 들어오면 한 번 재생하고 이 초의 장면에서 멈춤
      last = now;
      if (LIVE) follow(dt);
      if (frame) frame(time);
    }
    // 스크롤 진행: CONFIG.track이 있으면 그 칸(키 큰 칸 안에 이 상자를 position:sticky로 넣은 경우)을 다 내려가는 정도, 없으면 이 상자가 화면 아래에서 위로 지나가는 정도
    function measure() {
      const el = CFG.track ? document.querySelector(CFG.track) : root;
      if (!el) return;
      const r = el.getBoundingClientRect(), vh = window.innerHeight || 1;
      live.ts = Math.max(0, Math.min(1, CFG.track ? -r.top / Math.max(1, r.height - vh) : (vh - r.top) / (vh + r.height)));
    }
    // 진짜 마우스·스크롤 값을 부드럽게 따라감
    function follow(dt) {
      const k = 1 - Math.exp(-dt * 14);
      live.x += (live.tx - live.x) * k;
      live.y += (live.ty - live.y) * k;
      live.over += ((live.on ? 1 : 0) - live.over) * (1 - Math.exp(-dt * 6));
      live.down += ((live.press ? 1 : 0) - live.down) * (1 - Math.exp(-dt * 18));
      if (!TRY) { measure(); live.s += (live.ts - live.s) * (1 - Math.exp(-dt * 10)); }
    }
    const spot = e => {
      const r = root.getBoundingClientRect();
      live.tx = (e.clientX - r.left) * root.clientWidth / (r.width || 1);
      live.ty = (e.clientY - r.top) * root.clientHeight / (r.height || 1);
      if (!live.ready) { live.x = live.tx; live.y = live.ty; live.ready = true; }
    };
    // 멈춰 있을 때(일시 정지·동작 줄이기 설정)도 마우스에는 바로 반응
    const poke = () => { if (playing || !frame) return; live.x = live.tx; live.y = live.ty; live.over = live.on ? 1 : 0; live.down = live.press ? 1 : 0; frame(time); };
    const hands = {
      pointerenter: e => { spot(e); live.on = true; poke(); },
      pointermove: e => { spot(e); live.on = true; poke(); },
      pointerleave: () => { live.on = false; live.press = false; poke(); },
      pointerdown: e => { spot(e); live.on = live.press = true; poke(); },
      pointerup: () => { live.press = false; poke(); }
    };
    if (LIVE) Object.keys(hands).forEach(k => root.addEventListener(k, hands[k]));
    // 화면에 보일 때만 움직입니다
    function sync() {
      const on = want && seen;
      if (on && !playing) { playing = true; last = performance.now(); raf = requestAnimationFrame(tick); }
      if (!on && playing) { playing = false; cancelAnimationFrame(raf); }
    }
  
    Object.assign(root.style, { position: 'relative', overflow: 'hidden', background: CFG.bg, aspectRatio: CFG.ratio });
    build();
    const ro = new ResizeObserver(() => { clearTimeout(timer); timer = setTimeout(build, 100); });
    const io = new IntersectionObserver(e => { seen = e[e.length - 1].isIntersecting; sync(); });
    // 웹폰트로 그리는 모션은 폰트가 도착하면 크기를 다시 재서 그립니다
    const refit = () => { if (frame && (frame.fonts || drew)) { size = ''; build(); } };
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refit);
    ro.observe(root);
    io.observe(root);
    sync();
  
    return {
      play() { want = true; sync(); },
      pause() { want = false; sync(); },
      restart() { time = 0; if (frame) frame(time); },
      seek(t) { time = t; if (frame) frame(time); if (watch) mend(watch.takeRecords()); },   // t초의 장면으로 건너뜀 (영상으로 한 장씩 찍을 때)
      now() { return time; },                       // 지금 몇 초의 장면인지 (발표기에서 씀)
      motion() { return frame; },                   // 모션이 돌려준 장면 함수 (frame.steps 같은 정보를 읽을 때)
      slots() { return used.size || usedArt.size; },   // 이 장면이 쓰는 그림 칸 수 (사이트의 '내 사진' 칸)
      destroy() { want = false; sync(); if (LIVE) Object.keys(hands).forEach(k => root.removeEventListener(k, hands[k])); ro.disconnect(); io.disconnect(); if (watch) watch.disconnect(); clearTimeout(timer); if (document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener('loadingdone', refit); if (frame && frame.dispose) frame.dispose(); root.textContent = ''; }
    };
  }

  qmEngine(document.getElementById('qm-ina-sprout'), CONFIG, ic3Sprout);
})();
</script>
</body>
